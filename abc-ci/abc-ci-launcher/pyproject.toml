[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abc-ci-launcher"
version = "0.1.0"
description = "Command-line launcher for abc-ci GitLab trigger pipelines"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.scripts]
abc-ci = "abc_ci_launcher.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
