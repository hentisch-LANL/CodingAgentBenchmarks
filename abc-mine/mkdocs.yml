site_name: abc-mine
site_description: Mine a git codebase for agentic-coding benchmarks and emit ABC Bench tasks

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - Guide:
      - Overview: guide/overview.md
      - Configuration: guide/configuration.md
      - CLI Reference: guide/cli.md
      - Slurm Submission: guide/slurm.md
      - Prompt Customization: guide/prompt-customization.md
      - Scoring Rubric: guide/rubric.md
      - Checkpointing and Resume: guide/checkpointing.md
      - Limitations: guide/limitations.md
  - API Reference:
      - Overview: api-reference/index.md
      - abc_mine.config: api-reference/abc_mine.config.md
      - abc_mine.rubric: api-reference/abc_mine.rubric.md
      - abc_mine.prompts: api-reference/abc_mine.prompts.md
      - abc_mine.manifest: api-reference/abc_mine.manifest.md
      - abc_mine.repo: api-reference/abc_mine.repo.md
      - abc_mine.preflight: api-reference/abc_mine.preflight.md
      - abc_mine.parallel: api-reference/abc_mine.parallel.md
      - abc_mine.sandbox: api-reference/abc_mine.sandbox.md
      - abc_mine.stages.screen: api-reference/abc_mine.stages.screen.md
      - abc_mine.stages.rank: api-reference/abc_mine.stages.rank.md
      - abc_mine.stages.build: api-reference/abc_mine.stages.build.md
      - abc_mine.cli: api-reference/abc_mine.cli.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - attr_list
  - def_list
  - tables

copyright: Copyright &copy; 2026 LANL-Bench Contributors
