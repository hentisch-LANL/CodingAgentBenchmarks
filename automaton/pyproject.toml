[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automaton"
version = "0.1.1"
description = "Automaton: a general-purpose sandboxed autonomous-agent execution engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Automaton Contributors"}
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "black>=22.0",
    "mypy>=0.990",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
    "mkdocstrings-python>=1.0",
    "black>=22.0",
]
mpi = [
    "mpi4py>=3.1",
]

[tool.setuptools]
packages = ["automaton", "automaton.pool"]
